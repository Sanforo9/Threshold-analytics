<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threshold Analytics</title>
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f6f7;--card:#fff;--ink:#14212b;--muted:#5b6b78;--line:#e1e7ea;--grid:#e8edf0;
  --accent:#0f766e;--accent-ink:#fff;--amber:#d97706;--blue:#2563eb;--violet:#7c3aed;
  --ok:#15803d;--okbg:#e8f6ee;--warn:#b45309;--warnbg:#fdf3e0;--bad:#b91c1c;--badbg:#fdecec;--info:#31506a;--infobg:#eaf1f7;
  --z1:#94a3b8;--z2:#38bdf8;--z3:#4ade80;--z4:#fb923c;--z5:#ef4444;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1317;--card:#151d23;--ink:#e8eef2;--muted:#8fa0ad;--line:#26323b;--grid:#212c34;
  --accent:#2dd4bf;--accent-ink:#04201d;--amber:#fbbf24;--blue:#60a5fa;--violet:#a78bfa;
  --ok:#4ade80;--okbg:#14291d;--warn:#fbbf24;--warnbg:#2e2410;--bad:#f87171;--badbg:#321818;--info:#9cc1de;--infobg:#17262f;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.hwrap{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--accent);display:inline-block}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:transparent;padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:600;cursor:pointer}
nav button.on{background:var(--infobg);color:var(--ink)}
button,select,input{font:inherit;color:var(--ink)}
.btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
main{max-width:1180px;margin:0 auto;padding:20px 20px 70px;display:grid;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h2{font-size:13px;margin:0 0 12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.card h3{margin:0 0 4px;font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted)}.kpi .v{font-size:22px;font-weight:700;line-height:1.2}.kpi .s{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:18px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
canvas{width:100%;height:240px;display:block}
.tip{position:absolute;display:none;top:30px;background:var(--ink);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:6px;pointer-events:none;white-space:nowrap}
.drop{border:2px dashed var(--line);border-radius:14px;padding:34px 20px;text-align:center;background:var(--card);cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--infobg)}
.drop b{font-size:17px}.drop p{margin:6px 0 0;color:var(--muted)}
.ins{border-left:4px solid var(--line);border-radius:8px;padding:10px 14px;margin:8px 0;background:var(--bg)}
.ins b{display:block;margin-bottom:2px}
.ins.ok{border-color:var(--ok);background:var(--okbg)}.ins.warn{border-color:var(--warn);background:var(--warnbg)}
.ins.bad{border-color:var(--bad);background:var(--badbg)}.ins.info{border-color:var(--info);background:var(--infobg)}
.ins span.tag{float:right;font-size:11px;font-weight:700;text-transform:uppercase;opacity:.8}
.ins.ok .tag{color:var(--ok)}.ins.warn .tag{color:var(--warn)}.ins.bad .tag{color:var(--bad)}.ins.info .tag{color:var(--info)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.sb{justify-content:space-between}
.zbar{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:6px 0}
.zrow{display:grid;grid-template-columns:minmax(150px,250px) 1fr 100px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.zrow .b{height:10px;border-radius:5px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted)}
tr.click{cursor:pointer}tr.click:hover{background:var(--infobg)}
.tw{overflow-x:auto}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.muted{color:var(--muted)}
details{margin-top:10px}summary{cursor:pointer;color:var(--muted);font-weight:600}
details p{margin:6px 0}
#install{display:none}
.sum{border:1px solid var(--line);border-left:6px solid var(--info);border-radius:12px;background:var(--card);padding:16px 18px}
.sum.ok{border-left-color:var(--ok)}.sum.warn{border-left-color:var(--warn)}.sum.bad{border-left-color:var(--bad)}
.sum .sh{font-size:19px;font-weight:700;line-height:1.35;margin:2px 0 10px}
.sum .lab{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sum ul{list-style:none;margin:8px 0 12px;padding:0}
.sum li{display:flex;gap:10px;padding:5px 0;border-top:1px solid var(--line)}
.sum li:first-child{border-top:0}
.sum li i{flex:0 0 10px;height:10px;border-radius:50%;margin-top:7px;background:var(--info)}
.sum li i.ok{background:var(--ok)}.sum li i.warn{background:var(--warn)}.sum li i.bad{background:var(--bad)}
.sum li b{min-width:180px;display:inline-block;padding-right:8px}
@media (max-width:620px){.sum li b{display:block;min-width:0}}
.sum .adv{background:var(--bg);border-radius:8px;padding:10px 12px}
.mbg{position:fixed;inset:0;background:rgba(10,18,24,.55);z-index:40;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 14px}
.modal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:760px;width:100%}
.modal h3{margin:0 0 4px;font-size:18px}
.modal .sec{margin-top:16px}
.modal .sec>b{display:block;margin-bottom:6px}
.fl{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:11px;background:var(--infobg);color:var(--info);border-radius:99px;padding:1px 8px;font-weight:700}
.need{font-size:11px;color:var(--warn);font-weight:700}
.btn.big{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px}
.btn.big small{display:block;color:var(--muted);font-weight:400}
#over{position:fixed;inset:0;background:rgba(15,118,110,.18);border:4px dashed var(--accent);display:none;align-items:center;justify-content:center;font-size:24px;font-weight:700;z-index:50;pointer-events:none;color:var(--ink)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;max-width:90vw;z-index:60;display:none;white-space:pre-line;font-size:14px}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:700;background:var(--infobg);color:var(--info)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="brand"><i></i>Threshold Analytics</div>
  <nav id="nav">
    <button data-t="actividad" class="on">Actividad</button>
    <button data-t="semana">Semana</button>
    <button data-t="historial">Historial</button>
    <button data-t="tests">Tests</button>
    <button data-t="perfil">Perfil</button>
  </nav>
  <div class="row">
    <select id="athSel" style="width:auto;max-width:200px;display:none" title="Deportista"></select>
    <button class="btn primary" id="upload">＋ Subir sesiones</button>
    <button class="btn" id="clear" title="Limpiar sesiones para empezar de nuevo">🧹 Limpiar</button>
    <button class="btn" id="install">⬇ Instalar app</button>
    <input type="file" id="files" accept=".fit,.gpx,.tcx" multiple hidden>
  </div>
</div></header>
<main id="main"></main>
<div id="modal"></div>
<div id="over">Suelta tus archivos .fit / .gpx / .tcx</div>
<div id="toast"></div>
<script src="core.js"></script>
<script src="charts.js"></script>
<script src="tests.js"></script>
<script src="app.js"></script>
</body>
</html>
